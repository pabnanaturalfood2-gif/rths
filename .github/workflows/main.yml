
name: Browser Terminal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install terminal tools
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/bin"

          curl -fsSL \
            https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64 \
            -o "$HOME/.local/bin/ttyd"

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$HOME/.local/bin/cloudflared"

          chmod +x "$HOME/.local/bin/ttyd"
          chmod +x "$HOME/.local/bin/cloudflared"

      - name: Start browser terminal
        env:
          TERMINAL_PASSWORD: ${{ secrets.TERMINAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TERMINAL_PASSWORD:-}" ]; then
            echo "Missing TERMINAL_PASSWORD repository secret."
            exit 1
          fi

          # Do not expose the repository secret to terminal sessions.
          PASSWORD="$TERMINAL_PASSWORD"
          unset TERMINAL_PASSWORD

          # Start the terminal with password authentication.
          "$HOME/.local/bin/ttyd" \
            -p 7681 \
            -c "terminal:$PASSWORD" \
            -W \
            bash -l \
            > /tmp/ttyd.log 2>&1 &

          unset PASSWORD

          # Start a temporary Cloudflare Quick Tunnel.
          "$HOME/.local/bin/cloudflared" \
            tunnel \
            --url http://127.0.0.1:7681 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          # Wait for the public browser URL.
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$!" 2>/dev/null; then
              :
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Tunnel URL was not found."
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "=================================="
          echo "Browser Terminal URL: $URL"
          echo "Username: terminal"
          echo "Enter your repository secret password."
          echo "=================================="

          # Keep the workflow alive while the terminal is running.
          while kill -0 "$(pgrep -f 'ttyd.*7681' | head -n 1)" 2>/dev/null; do
            sleep 15
          done
